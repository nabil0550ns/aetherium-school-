<!doctype html>
<html lang="ar" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدرسة الأندلس الخاصة | صرح الريادة وبناء العقول — للأعمار 3–14</title>
    
    <!-- Google Fonts: Cairo (Modern Arabic UI/Display), Tajawal (Educational Editorial), Plus Jakarta Sans (Latin) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0B1526] text-[#F8F6F2] antialiased selection:bg-[#C9A24B]/30 selection:text-[#2FD6C8] overflow-x-hidden min-h-screen">
    <!-- Global SVG Filter for Liquid Glass Morph -->
    <svg class="sr-only" aria-hidden="true" width="0" height="0">
      <defs>
        <filter id="liquid-glass-morph" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence id="liquid-turbulence" type="fractalNoise" baseFrequency="0.015 0.015" numOctaves="3" result="noise" seed="42" />
          <feDisplacementMap id="liquid-displacement" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
